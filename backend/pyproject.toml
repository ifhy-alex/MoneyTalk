[project]
name = "moneytalk"
version = "0.1.0"
description = "Sistema personal de finanzas e inversiones"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[project.scripts]
moneytalk = "moneytalk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneytalk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "DTZ", "PL"]
ignore = [
    "PLR0913",  # FastAPI y servicios reciben varios parámetros
    "PLR2004",  # números mágicos: umbrales financieros explícitos
    "PLR0917",  # endpoints con varios filtros opcionales
    "PLC0415",  # imports diferidos a propósito (librerías pesadas u opcionales)
    "RUF001", "RUF002", "RUF003",  # textos en español con caracteres "ambiguos"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "DTZ"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.oauth2.*",
    "google.auth.*",
    "yfinance.*",
    "fitz.*",
    "pymupdf.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# PyMuPDF y google-auth no publican tipos completos.
module = ["moneytalk.ingestion.pdf", "moneytalk.ingestion.gmail", "tests.helpers", "tests.test_auto_ingest"]
disallow_untyped_calls = false
