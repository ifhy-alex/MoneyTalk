name: moneytalk

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    DATA_DIR: /app/data
    GMAIL_CREDENTIALS_FILE: /app/data/gmail_credentials.json
    GMAIL_TOKEN_FILE: /app/data/gmail_token.json
    CORS_ORIGINS: '["http://localhost:5173"]'
  volumes:
    - ./backend/src:/app/src
    - ./backend/migrations:/app/migrations
    - ./data:/app/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn moneytalk.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    ports:
      - "127.0.0.1:8000:8000"

  # Tareas programadas en su propio proceso: con --reload la API se reinicia y
  # duplicaría los jobs si el scheduler viviera dentro de ella.
  worker:
    <<: *backend
    command: python -m moneytalk.scheduler
    depends_on:
      api:
        condition: service_started

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
