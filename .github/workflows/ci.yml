name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moneytalk
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: moneytalk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moneytalk" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://moneytalk:ci@127.0.0.1:5432/moneytalk_test
      DATABASE_URL: postgresql+psycopg://moneytalk:ci@127.0.0.1:5432/moneytalk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest --cov=moneytalk --cov-report=term-missing
      - name: Migraciones sin drift
        run: uv run alembic upgrade head && uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
